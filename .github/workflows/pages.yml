name: Deploy to GitHub Pages

# Serves the Next.js app as a static export. Both suites gate the deploy: the
# vanilla app's tests still guard the instrument banks and scoring, and the
# rewrite's parity tests are what prove the two agree — so a change that moves
# a number in one and not the other fails here rather than in front of a reader.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The reference implementation the rewrite is checked against. It has no
      # dependencies, so there is nothing to install.
      - name: Test the reference implementation
        run: npm test

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # `npm ci` is the right tool and it fails here for a reason worth
      # recording: npm resolves a package's *optional* native dependencies for
      # the platform the lockfile was written on. This lockfile is written on
      # macOS; on Linux, Tailwind's wasm fallback pulls @emnapi at a version
      # the lock has never seen, and `npm ci` refuses rather than guessing.
      # Neither is wrong — the lock genuinely does not describe this platform.
      # So: keep the deterministic path when it works, and fall back rather
      # than blocking a deploy on a difference that affects no application code.
      - name: Install
        working-directory: web
        run: npm ci || npm install --no-audit --no-fund
      - run: npm run typecheck
        working-directory: web
      - run: npm run lint
        working-directory: web
      # Includes the parity suite: every instrument scored against the vanilla
      # implementation on twelve randomised answer sets.
      - run: npx vitest run
        working-directory: web

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # `npm ci` is the right tool and it fails here for a reason worth
      # recording: npm resolves a package's *optional* native dependencies for
      # the platform the lockfile was written on. This lockfile is written on
      # macOS; on Linux, Tailwind's wasm fallback pulls @emnapi at a version
      # the lock has never seen, and `npm ci` refuses rather than guessing.
      # Neither is wrong — the lock genuinely does not describe this platform.
      # So: keep the deterministic path when it works, and fall back rather
      # than blocking a deploy on a difference that affects no application code.
      - name: Install
        working-directory: web
        run: npm ci || npm install --no-audit --no-fund

      # A project page is served from `/<repo>/`, so the prefix is compiled in.
      # A custom domain sets NEXT_BASE_PATH to an empty string and nothing else
      # about the build changes.
      - name: Build the static export
        working-directory: web
        env:
          NEXT_OUTPUT: export
          NEXT_BASE_PATH: /my-instructions
          NEXT_PUBLIC_SITE_URL: https://aleksanderdudek.github.io
          # Where a published profile is stored, so a link can later be
          # withdrawn. A repository *variable* rather than a secret: it is a
          # public URL that ends up in the shipped JavaScript, and calling it a
          # secret would be theatre. Unset is the supported state — with no
          # endpoint the app is self-contained tokens and honest expiry, and
          # the withdraw control simply does not appear.
          NEXT_PUBLIC_PUBLISH_ENDPOINT: ${{ vars.PUBLISH_ENDPOINT }}
        run: npm run build:static

      - name: Install Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      # Served from a subdirectory, exactly as Pages will serve it, so a path
      # bug that only appears under a base path fails here and not in public.
      - name: Test the export the way it will be served
        working-directory: web
        env:
          E2E_BASE_URL: http://127.0.0.1:3200
          E2E_PREFIX: /my-instructions
        run: |
          mkdir -p /tmp/pages/my-instructions
          cp -R out/. /tmp/pages/my-instructions/
          npx --yes serve /tmp/pages -l 3200 --no-clipboard &
          npx wait-on http://127.0.0.1:3200/my-instructions/en/ --timeout 60000
          npm run e2e

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
