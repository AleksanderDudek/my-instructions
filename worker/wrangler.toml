name = "my-instructions-links"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# One namespace, holding ciphertext and an expiry. Nothing here is readable by
# the account that owns it, which is the point — see src/index.ts.
[[kv_namespaces]]
binding = "PROFILES"
id = "ecafb2df1f2b4039abb2feda3abb1824"

[vars]
# Comma-separated. No wildcard: an unlisted origin gets no CORS header, and the
# browser refuses the call. Add localhost only while developing.
ALLOWED_ORIGINS = "https://aleksanderdudek.github.io"
